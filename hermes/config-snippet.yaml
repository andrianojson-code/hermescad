# Add to Hermes config.yaml (%LOCALAPPDATA%\hermes\ for the desktop app, %USERPROFILE%\.hermes\ for the CLI).
# install.ps1 writes a ready version with your real paths to hermes\config-snippet.generated.yaml
mcp_servers:
  hermescad:
    command: 'C:\path\to\hermescad\.venv\Scripts\python.exe'
    args: ["-m", "hermescad_mcp"]
    env:
      HERMESCAD_HOST: "127.0.0.1"
      HERMESCAD_PORT: "9876"
      HERMESCAD_TOKEN: ""
    timeout: 300
    connect_timeout: 30
  hermes3d:                       # Blender part (picture -> 3D mesh)
    command: 'C:\path\to\hermescad\.venv\Scripts\python.exe'
    args: ["-m", "hermescad_mcp.blender"]
    env:
      HERMES3D_HOST: "127.0.0.1"
      HERMES3D_PORT: "9877"
      HERMES3D_OUT: 'C:\path\to\hermescad\generated'
      HF_TOKEN: ""                # optional, free Hugging Face token: bigger daily GPU quota
      TRIPO_API_KEY: ""           # optional, paid Tripo API
    timeout: 900
    connect_timeout: 60

